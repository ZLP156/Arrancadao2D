name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar projeto Android com o jogo dentro
        run: |
          set -e
          P=apk
          mkdir -p $P/app/src/main/assets $P/app/src/main/java/com/arrancadao/jogo $P/app/src/main/res/mipmap-xxxhdpi
          cp index.html $P/app/src/main/assets/index.html
          if [ -f icon-512.png ]; then cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png;
          elif [ -f icon-192.png ]; then cp icon-192.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png;
          else echo "Envie o icon-512.png para o repositório"; exit 1; fi

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Arrancadao2D"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.arrancadao.jogo'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.arrancadao.jogo'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig signingConfigs.debug }
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Arrancadão 2D"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/arrancadao/jogo/MainActivity.java <<'EOF'
          package com.arrancadao.jogo;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  hideBars();
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }

              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); hideBars(); }
              @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          EOF

      - name: Compilar APK
        run: gradle -p apk assembleRelease --no-daemon

      - name: Renomear APK
        run: cp apk/app/build/outputs/apk/release/app-release.apk Arrancadao2D.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Arrancadao2D-APK
          path: Arrancadao2D.apk

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Arrancadão 2D (versão ${{ github.run_number }})
          files: Arrancadao2D.apk
